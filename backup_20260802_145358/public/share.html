<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>추천 - FridgeChef</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div id="nav"></div>
    <h1>🎁 친구에게 FridgeChef 추천하기</h1>
    <p class="subtitle">냉장고 속 재료로 레시피를 찾아주는 FridgeChef, 친구에게도 링크를 공유해보세요.</p>

    <div class="share-box">
      <input type="text" id="share-link" readonly />
      <button type="button" id="copy-btn">링크 복사</button>
    </div>
    <p id="copy-message" class="hint"></p>
  </main>

  <script src="nav.js"></script>
  <script src="share.js"></script>
</body>
</html>
